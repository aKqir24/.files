
[window]
dynamic_padding = true
padding = { x = 12, y = 12 }

[font]
size = 10
normal = { 
	family = "Hurmit Nerd Font",
	style = "normal"
}
bold = { 
	family = "Hurmit Nerd Font",
	style = "bold"
}
italic = {
	family = "Hurmit Nerd Font", 
	style = "italic"
}
bold_italic = {
	family = "Hurmit Nerd Font", 
	style = "bold italic"
}

[env]
WINIT_UNIX_BACKEND = "x11"

[scrolling]
history = 1000 # Default is often 10,000 or higher
multiplier = 3

[general]
import = ["~/.cache/matugen/alacritty-colors.toml"]
