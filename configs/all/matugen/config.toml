[config]
[templates.alacritty]
input_path = '~/.files/resources/matugen-themes/templates/alacritty.toml'
output_path = '~/.cache/matugen/alacritty-colors.toml'

[templates.nvim]
input_path = '~/.files/resources/matugen-themes/templates/neovim/template.lua'
output_path = '~/.cache/matugen/nvim-colors.lua'
post_hook = 'pkill -SIGUSR1 nvim'

[templates.xmonad-colors]
input_path = '~/.files/resources/matugen-themes/templates/Colors.hs'
output_path = '~/.cache/matugen/Colors.hs'
post_hook= 'xmonad --recompile && xmonad --restart'

[templates.vscode-raw]
input_path = '~/.files/resources/matugen-themes/templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = '~/.files/resources/matugen-themes/templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

[templates.wine]
input_path = '~/.files/resources/matugen-themes/templates/wine.reg'
output_path = '~/.cache/matugen/wine.reg'
post_hook = 'wine regedit ~/.cache/matugen/wine.reg'

[templates.gtk3]
input_path = '~/.files/resources/matugen-themes/templates/gtk-colors.css'
output_path = '~/.cache/matugen/gtk-3.0-colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = '~/.files/resources/matugen-themes/templates/gtk-colors.css'
output_path = '~/.cache/matugen/gtk-4.0-colors.css'
post_hook = '~/.files/resources/matugen-themes/post-hook-scripts/gtk-themes-reload.sh'

[templates.eww]
input_path = '~/.files/resources/matugen-themes/templates/eww.scss'
output_path = '~/.cache/matugen/eww-colors.scss'
post_hook = "eww reload"

[templates.rofi]
input_path = '~/.files/resources/matugen-themes/templates/rofi-colors.rasi'
output_path = '~/.cache/matugen/rofi-colors.rasi'

[templates.opencode]
input_path = '~/.files/resources/matugen-themes/templates/opencode-colors.json'
output_path = '~/.cache/matugen/opencode-colors.json'

[templates.obs]
input_path = '~/.files/resources/matugen-themes/templates/matugen.obt'
output_path = '~/.cache/matugen/obs-theme.obt'

[templates.papirus-folders]
input_path = '~/.files/resources/matugen-themes/templates/papirus-color'
colors_to_compare = [
    { name = "black",      color = "#4f4f4f" },
    { name = "blue",       color = "#5294e2" },
    { name = "bluegrey",   color = "#607d8b" },
    { name = "brown",      color = "#ae8e6c" },
    { name = "carmine",    color = "#a30002" },
    { name = "cyan",       color = "#00bcd4" },
    { name = "darkcyan",   color = "#45abb7" },
    { name = "deeporange", color = "#eb6637" },
    { name = "green",      color = "#87b158" },
    { name = "grey",       color = "#8e8e8e" },
    { name = "indigo",     color = "#5c6bc0" },
    { name = "magenta",    color = "#ca71df" },
    { name = "nordic",     color = "#81a1c1" },
    { name = "orange",     color = "#ee923a" },
    { name = "palebrown",  color = "#d1bfae" },
    { name = "paleorange", color = "#eeca8f" },
    { name = "pink",       color = "#f06292" },
    { name = "red",        color = "#e25252" },
    { name = "teal",       color = "#16a085" },
    { name = "violet",     color = "#7e57c2" },
    { name = "white",      color = "#e4e4e4" },
    { name = "yaru",       color = "#676767" },
    { name = "yellow",     color = "#f9bd30" },
]
compare_to = "{{ colors.primary.default.hex }}"
post_hook = 'nohup sudo -n papirus-folders -C {{ closest_color }} -u > /dev/null 2>&1 &'
index = 1

[templates.pywalfox]
input_path = '~/.files/resources/matugen-themes/templates/pywalfox-colors.json'
output_path = "~/.cache/matugen/pywalfox-colors.json"
post_hook   = '''
bash -c '
{
  if command -v pywalfox >/dev/null 2>&1; then
    [ -d "$HOME/.cache/wal" ] || mkdir -p "$HOME/.cache/wal"
    ln -nfs "$HOME/.cache/matugen/pywalfox-colors.json" "$HOME/.cache/wal/colors.json"
    pywalfox update
  fi
} >/dev/null 2>&1 </dev/null & disown
'
'''
